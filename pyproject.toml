[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txn-intelligence"
version = "0.1.0"
description = "Fraud/anomaly detection and spending insights on public or synthetic transaction data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn==1.9.1",
    "scipy>=1.11",
    "duckdb>=0.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# torch is only needed for the MLP experiments, so the serving image stays small.
dl = ["torch>=2.2"]
chat = ["gradio>=4"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
